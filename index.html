<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <h2>Smart Library 1.0</h2>
    </nav>

    <section class="modal">
        <form>
                <h2>Editar Libro</h2>
                <div class="entrada">
                    <label>Titulo</label>
                    <input type="text" placeholder="Escriba el título" id="modal-title" required>
                </div>
                <div class="entrada">
                    <label>Autor</label>
                    <input type="text" placeholder="Escriba el título" id="modal-author" required>
                </div>
                <div class="entrada">
                    <label>Género</label>
                    <input type="text" placeholder="Escriba el título" id="modal-genre" required>
                </div>
                <div class="entrada">
                    <label>Año</label>
                    <input type="text" placeholder="Escriba el título" id="modal-year" required>
                </div>
                <button type="submit" class="btnSubmit btnSubmitModal">Editar</button>
            </form>
    </section>

    <aside>
        <div class="bookAdd">
            <form>
                <h2>Agregar Libro</h2>
                <div class="entrada">
                    <label>Titulo</label>
                    <input type="text" placeholder="Escriba el título" id="title" required>
                </div>
                <div class="entrada">
                    <label>Autor</label>
                    <input type="text" placeholder="Escriba el título" id="author" required>
                </div>
                <div class="entrada">
                    <label>Género</label>
                    <input type="text" placeholder="Escriba el título" id="genre" required>
                </div>
                <div class="entrada">
                    <label>Año</label>
                    <input type="text" placeholder="Escriba el título" id="year" required>
                </div>
                <button type="submit" class="btnSubmit">Agregar</button>
            </form>
        </div>
    </aside>

    <main></main>

    <footer></footer>

    <script src="model/book.js" type="module"></script>
    <script src="JS/app.js" type="module"></script>
    <script src="JS/data.js" type="module"></script>    
    <script src="JS/render.js" type="module"></script>  
</body>
</html>
