<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <nav><h1>SmartLibrary 1.0</h1></nav>
    <div class="filterBar">
        <h3>Filtrar:</h3>
        <select id="filter-select">
            <option value="titleSelect">Titulo</option>
            <option value="authorSelect">Autor</option>
            <option value="genreSelect">Genero</option>
            <option value="yearSelect">Año</option>
            <option value="favoriteSelect">Favoritos</option>
            <option value="borrowedSelect">Prestado</option>
        </select>
        <input type="text" placeholder="Filtrar..." id="inputFilter">
    </div>
    <aside>
        <form class="addMenu">
            <div class="addEntries">
                <h3>Nuevo libro</h3>
                 <div class="addEntry">
                    <label>Titulo</label>
                    <input type="text" placeholder="Escriba el título" id="addTitle" required>
                </div>
                <div class="addEntry">
                    <label>Autor</label>
                    <input type="text" placeholder="Escriba el autor" id="addAuthor" required>
                </div>
                <div class="addEntry">
                    <label>Genero</label>
                    <input type="text" placeholder="Escriba el género" id="addGenre" required>
                </div>
                <div class="addEntry">
                    <label>Year</label>
                    <input type="text" placeholder="Escriba el año" id="addYear" required>
                </div>
            </div>
            <div class="addbtn">
                <button type="submit" id="btnAdd">Agregar</button>
            </div>
        </form>

        <div class="dashboard">
            <h3>Total Libros</h3>
            <h2>0</h2>
        </div>
        <div class="dashboard">
            <h3>Total mostrados</h3>
            <h2 class="book-showed">0</h2>
        </div>
        
    </aside>
    <main></main>
    <footer>Copyright @LeonelFedericoSoto</footer>

    <div class="modal">
        <h2>Editar libro</h2>
        <div class="entry">
            <label>Title</label>
            <input type="text" id="titleEdit">
        </div>
        <div class="entry">
            <label>Autor</label>
            <input type="text" id="authorEdit">
        </div>
        <div class="entry">
            <label>Genre</label>
            <input type="text" id="genreEdit">
        </div>
        <div class="entry">
            <label>Year</label>
            <input type="text" id="yearEdit">
        </div>
        <button class="btnConfirm">Confirmar</button>
    </div>

    <script src="JSS/render.js" type="module"></script>
</body>
</html>
